name: daily-report

services:
  api:
    build:
      context: .
      args:
        INSTALL_DEBUGPY: "true"
    command: sh scripts/start-api.sh
    environment:
      ENVIRONMENT: local
      # DEBUGPY=1 make dev: chạy API dưới debugpy để VS Code attach (xem README, mục Debug).
      DEBUGPY: ${DEBUGPY:-0}
      DEBUGPY_WAIT: ${DEBUGPY_WAIT:-0}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-daily_report}:${POSTGRES_PASSWORD:-daily_report}@postgres:5432/${POSTGRES_DB:-daily_report}
      REDIS_URL: redis://redis:6379/0
    ports:
      - "${API_PORT:-8001}:8000"
      - "${DEBUGPY_PORT:-5678}:5678"
    volumes:
      - ./src:/app/src
      - ./migrations:/app/migrations
      - ./scripts:/app/scripts
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-daily_report}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-daily_report}
      POSTGRES_DB: ${POSTGRES_DB:-daily_report}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7.4-alpine
    ports:
      - "${REDIS_PORT:-6380}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  mailpit:
    image: axllent/mailpit:v1.31
    ports:
      - "${MAILPIT_UI_PORT:-8026}:8025"
      - "${MAILPIT_SMTP_PORT:-1026}:1025"

volumes:
  postgres-data:
