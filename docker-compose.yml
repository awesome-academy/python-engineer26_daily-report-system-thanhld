name: daily-report

services:
  api:
    build:
      context: .
      args:
        INSTALL_DEBUGPY: "true"
    command: sh scripts/start-api.sh
    environment:
      ENVIRONMENT: local
      # make debug: chạy API dưới debugpy để VS Code attach (xem README, mục Debug).
      DEBUGPY: ${DEBUGPY:-0}
      DEBUGPY_WAIT: ${DEBUGPY_WAIT:-0}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-daily_report}:${POSTGRES_PASSWORD:-daily_report}@postgres:5432/${POSTGRES_DB:-daily_report}
      REDIS_URL: redis://redis:6379/0
      # Lưu trữ file: đặt trong .env (xem .env.example) để đổi sang S3.
      STORAGE_BACKEND: ${STORAGE_BACKEND:-local}
      LOCAL_STORAGE_BASE_URL: ${LOCAL_STORAGE_BASE_URL:-http://localhost:${API_PORT:-8001}/media}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_REGION: ${S3_REGION:-}
      S3_ENDPOINT_URL: ${S3_ENDPOINT_URL:-}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
    ports:
      - "${API_PORT:-8001}:8000"
      # Chỉ mở trên 127.0.0.1: ai attach được debugpy là chạy được code tùy ý trong container.
      - "127.0.0.1:${DEBUGPY_PORT:-5678}:5678"
    volumes:
      - ./src:/app/src
      - ./migrations:/app/migrations
      - ./scripts:/app/scripts
      # Ảnh đại diện (STORAGE_BACKEND=local) còn lại sau khi dựng lại container.
      - media-data:/app/media
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # Celery worker gửi email. Không tự reload khi sửa code: docker compose restart worker.
  worker:
    build: .
    command: celery -A app.worker worker
    environment:
      ENVIRONMENT: local
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-daily_report}:${POSTGRES_PASSWORD:-daily_report}@postgres:5432/${POSTGRES_DB:-daily_report}
      REDIS_URL: redis://redis:6379/0
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
      # Gốc của link trong email (đặt mật khẩu lần đầu). .env không vào image (.dockerignore).
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
    volumes:
      - ./src:/app/src
    depends_on:
      # Bảng email_logs do container api tạo khi chạy migration lúc khởi động.
      api:
        condition: service_healthy
      redis:
        condition: service_healthy
      mailpit:
        condition: service_started

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-daily_report}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-daily_report}
      POSTGRES_DB: ${POSTGRES_DB:-daily_report}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7.4-alpine
    ports:
      - "${REDIS_PORT:-6380}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  mailpit:
    image: axllent/mailpit:v1.31
    ports:
      - "${MAILPIT_UI_PORT:-8026}:8025"
      - "${MAILPIT_SMTP_PORT:-1026}:1025"

volumes:
  postgres-data:
  media-data:
